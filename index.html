<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administração - Vidal Pedras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <div>
                <h1>Vidal Pedras - Administração</h1>
                <p>Gerencie seu catálogo de produtos de forma simples.</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="openModal()">+ Novo Produto</button>
                <button class="btn btn-success" onclick="exportProducts()">💾 Exportar products.js</button>
                <a href="index.html" class="btn btn-outline" target="_blank">Ver Loja</a>
            </div>
        </header>

        <main class="admin-main">
            <div class="table-container">
                <table id="products-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Imagem</th>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody">
                        <!-- Produtos serão renderizados aqui pelo JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal for Add/Edit -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Adicionar Produto</h2>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <form id="product-form">
                <input type="hidden" id="product-id">
                
                <div class="form-group">
                    <label for="product-name">Nome do Produto *</label>
                    <input type="text" id="product-name" required placeholder="Ex: Turmalina Negra">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="product-type">Tipo *</label>
                        <select id="product-type" required>
                            <option value="pedra">Pedra Natural</option>
                            <option value="acessorio">Acessório</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product-category">Categoria *</label>
                        <input type="text" id="product-category" required placeholder="Ex: Proteção, Colares...">
                    </div>
                    <div class="form-group">
                        <label for="product-price">Preço (R$) *</label>
                        <input type="text" id="product-price" required placeholder="Ex: 45,00">
                    </div>
                </div>

                <div class="form-group">
                    <label for="product-description">Descrição *</label>
                    <textarea id="product-description" rows="3" required placeholder="Descreva a pedra ou acessório..."></textarea>
                </div>

                <div class="form-group">
                    <label for="product-benefits">Benefícios *</label>
                    <textarea id="product-benefits" rows="2" required placeholder="Ex: Limpeza energética, proteção..."></textarea>
                </div>

                <div class="form-group">
                    <label for="product-images">URLs das Imagens (Separadas por vírgula) *</label>
                    <textarea id="product-images" rows="3" required placeholder="URL 1, URL 2..."></textarea>
                    <small>A primeira imagem será a principal. É recomendado adicionar pelo menos duas imagens para o carrossel.</small>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Important: Load the existing products data first -->
    <script src="products.js"></script>
    <script src="admin.js"></script>
</body>
</html>
